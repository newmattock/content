<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Daytona workflow for running Omni Engineer and Claude Engineer</title>
  <desc id="desc">A workflow showing one repository opened in Daytona, reviewed by two AI engineer workspaces, and merged into one final patch.</desc>
  <rect width="980" height="420" fill="#0f172a"/>
  <g fill="#e5e7eb" font-family="Arial, sans-serif">
    <text x="56" y="64" font-size="30" font-weight="700">Paired AI engineer workflow in Daytona</text>
    <text x="56" y="96" font-size="16" fill="#cbd5e1">Use isolated workspaces so each agent can inspect the same task without sharing local state.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="58" y="148" width="210" height="112" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="86" y="184" fill="#e0f2fe" font-weight="700">Target repository</text>
    <text x="86" y="214" fill="#cbd5e1">Small issue, failing test,</text>
    <text x="86" y="238" fill="#cbd5e1">or review task</text>
    <rect x="386" y="82" width="224" height="118" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="420" y="120" fill="#dbeafe" font-weight="700">Omni Engineer</text>
    <text x="420" y="150" fill="#bfdbfe">Console workflow</text>
    <text x="420" y="174" fill="#bfdbfe">OpenRouter key only</text>
    <rect x="386" y="238" width="224" height="118" rx="12" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="420" y="276" fill="#ede9fe" font-weight="700">Claude Engineer</text>
    <text x="420" y="306" fill="#ddd6fe">Web UI or CLI</text>
    <text x="420" y="330" fill="#ddd6fe">Anthropic and E2B keys</text>
    <rect x="724" y="148" width="206" height="112" rx="12" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="756" y="184" fill="#cffafe" font-weight="700">Final patch</text>
    <text x="756" y="214" fill="#a5f3fc">Compare outputs, test,</text>
    <text x="756" y="238" fill="#a5f3fc">and submit one PR</text>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 190 C320 150, 340 128, 386 128"/>
    <path d="M268 222 C320 260, 340 306, 386 306"/>
    <path d="M610 142 C664 150, 688 174, 724 190"/>
    <path d="M610 306 C664 282, 688 238, 724 222"/>
  </g>
  <g fill="#94a3b8">
    <path d="M382 128 l-12 -7 v14 z"/>
    <path d="M382 306 l-12 -7 v14 z"/>
    <path d="M720 190 l-12 -7 v14 z"/>
    <path d="M720 222 l-12 -7 v14 z"/>
  </g>
</svg>
